[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceive-solve-reason"
version = "0.1.0"
description = "Reference implementation of progressive capability training for time series LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.51,<5",
  "accelerate>=1.3",
  "PyYAML>=6",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
psr-train = "psr.train:main"
psr-evaluate = "psr.evaluate:main"
psr-infer = "psr.infer:main"
psr-render-table = "psr.report:main"

[tool.setuptools.packages.find]
where = ["src"]
